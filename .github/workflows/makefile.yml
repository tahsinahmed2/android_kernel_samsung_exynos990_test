name: Build Exynos990 Kernel

on:
  workflow_dispatch: # manuell auslösbar
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_DEFCONFIG: exynos990_defconfig   # Passe ggf. an dein Defconfig an
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-      # Passe an die Toolchain an

    steps:
      - name: Checkout Kernel Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # volle Historie, wichtig für alte Commits

      - name: Setup KernelSU
        run: |
          rm -rf drivers/kernelsu
          git clone --no-single-branch https://github.com/tiann/KernelSU.git drivers/kernelsu
          cd drivers/kernelsu
          git fetch --unshallow || echo "Already full clone"
          git checkout cbad0d6
          cd ../..

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev bison flex libssl-dev

      - name: Setup Cross-Compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          make O=out ARCH=$ARCH $KERNEL_DEFCONFIG
          make -j$(nproc) O=out ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE

      - name: Archive Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/Image.gz-dtb
